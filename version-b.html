<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAFAF9">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Life Manager · design preview</title>
<style>
:root{
  --bg:#FAFAF9; --card:#FFFFFF; --subtle:#F3F3F1; --fill:#ECECE9; --border:#E6E5E1; --border2:#D5D4CF;
  --text:#1C1C1E; --text2:#6B6B70; --text3:#A0A0A6; --danger:#D9473B; --dangerBg:#FCE9E7;
  --warn:#B9770E; --warnBg:#FBF1DE; --success:#2E8B5E;
  --work:#5B6CF0; --workout:#EF6F5E; --routine:#A97CD6; --todo:#E3A33B; --errand:#3A9BD5; --budget:#3FA779;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141416; --card:#1D1D20; --subtle:#232327; --fill:#2C2C31; --border:#2E2E33; --border2:#45454C;
    --text:#F2F2F3; --text2:#A4A4AB; --text3:#6F6F77; --dangerBg:#3A1E1C; --warnBg:#3A2E17; --success:#5CC28F; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:'QuicksandFit','Quicksand',-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  font-size:14px;font-weight:600;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.app{max-width:1080px;margin:0 auto;padding:0 16px calc(32px + env(safe-area-inset-bottom))}
.banner{margin:12px 0 0;padding:9px 12px;border-radius:10px;background:var(--subtle);color:var(--text2);font-size:12px;display:flex;gap:8px;align-items:flex-start}
.banner b{color:var(--text);font-weight:700}
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:12px 16px 10px;margin:0 -16px;scrollbar-width:none;border-bottom:1px solid var(--border)}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:7px;flex-shrink:0;white-space:nowrap;padding:7px 13px;border-radius:999px;font-size:13px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text2)}
.tab.on{font-weight:700;color:var(--text)}
.dot{width:8px;height:8px;border-radius:99px;display:inline-block;flex-shrink:0}
.view{display:flex;flex-direction:column;gap:16px;padding-top:18px}
.view.home{padding-top:0}
.eyebrow{font-size:13px;color:var(--text2)}
.h1{font-size:24px;font-weight:700;letter-spacing:-.01em;margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--border);font-size:12px;cursor:pointer;background:transparent;color:var(--text)}
.chip .n{color:var(--text2)}
.chip.off{color:var(--text3)}
.grid2{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ct{display:flex;align-items:center;gap:8px}
.ct .t{font-size:15px;font-weight:700;flex:1}
.ct .r{font-size:12px;color:var(--text3)}
.link{background:none;border:none;padding:0;color:var(--text2);font-size:12px;cursor:pointer}
.label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-left:3px solid;background:var(--subtle);border-radius:8px;cursor:pointer;min-width:0}
.row .main{flex:1;min-width:0}
.row .title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:12px;color:var(--text2);margin-top:2px}
.done .title,.done.title{color:var(--text3);text-decoration:line-through}
.amt{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;flex-shrink:0}
.check{width:22px;height:22px;border-radius:7px;flex-shrink:0;cursor:pointer;padding:0;border:1.5px solid var(--border2);background:transparent;color:#fff;font-size:13px;font-weight:700;line-height:19px;text-align:center}
.prio{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;flex-shrink:0}
.p-High{background:var(--dangerBg);color:var(--danger)}
.p-Medium{background:var(--warnBg);color:var(--warn)}
.p-Low{background:var(--fill);color:var(--text2)}
.bar{height:6px;border-radius:99px;background:var(--fill);overflow:hidden}
.bar>div{height:100%;border-radius:99px;transition:width .25s}
.sched{display:flex;gap:10px;align-items:stretch}
.sched .tm{width:58px;flex-shrink:0;font-size:12px;color:var(--text2);padding-top:10px;font-variant-numeric:tabular-nums}
.sched .blk{flex:1;min-width:0;cursor:pointer;border-left:3px solid;border-radius:8px;padding:8px 12px;display:flex;align-items:center;gap:10px}
.step{display:flex;align-items:center;gap:10px;padding:5px 2px;cursor:pointer;font-size:14px}
.seg{display:inline-flex;background:var(--fill);border-radius:999px;padding:3px;align-self:flex-start}
.seg button{border:none;cursor:pointer;padding:5px 14px;border-radius:999px;font-size:13px;background:transparent;color:var(--text2)}
.seg button.on{font-weight:700;background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.calhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.calhead .h1{flex:1;font-size:22px}
.day h4{margin:0 0 6px;font-size:13px;font-weight:700}
.day h4.today{color:var(--work)}
.free{font-size:12px;color:var(--text3)}
.week{display:flex;flex-direction:column;gap:16px}
.mini{cursor:pointer;border-left:3px solid;border-radius:6px;padding:5px 7px;min-width:0}
.mini .s{font-size:10.5px;color:var(--text2);font-variant-numeric:tabular-nums}
.mini .x{font-size:12px;font-weight:600;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.mh{font-size:11px;color:var(--text3);text-align:center;text-transform:uppercase;letter-spacing:.05em;padding-bottom:4px}
.mc{cursor:pointer;min-height:58px;border-radius:8px;padding:4px;min-width:0;border:1px solid var(--border);display:flex;flex-direction:column;gap:4px;align-items:center}
.mc.sel{border-color:var(--text);background:var(--subtle)}
.num{font-size:12px;font-weight:700;width:22px;height:22px;line-height:22px;text-align:center;border-radius:99px}
.num.today{background:var(--text);color:var(--bg)}
.dots{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.dots .dot{width:6px;height:6px}
.mt{display:none}
.phead{display:flex;align-items:stretch;gap:12px}
.phead .stripe{width:6px;border-radius:3px;flex-shrink:0}
.phead .sub{font-size:13px;color:var(--text2);margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{border:1px solid var(--border);border-radius:12px;padding:10px 12px;min-width:0}
.stat .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.stats.money .v{font-size:15px}
.stats.money .stat{padding:10px}
.stat .l{font-size:12px;color:var(--text2)}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.wk .c{width:32px;height:32px;margin:6px auto;border-radius:99px;color:#fff;font-size:14px;font-weight:700;line-height:32px}
.wk .d{font-size:11px;color:var(--text3)}
.wk .g{font-size:10.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dateh{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.05em}
.dateh.today{color:var(--work)}
.heat{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px}
.heat div{aspect-ratio:1;border-radius:5px}
.between{display:flex;justify-content:space-between;font-size:11px;color:var(--text3)}
.spend{display:flex;flex-direction:column;gap:5px}
.spend .top{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.spend .top span:last-child{color:var(--text2);font-variant-numeric:tabular-nums;white-space:nowrap}
.spend.over .top span:last-child{color:var(--danger)}
.tx{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--border)}
.tx:first-child{border-top:none}
.tx .d{width:46px;font-size:12px;color:var(--text3);flex-shrink:0}
.tx .m{flex:1;min-width:0}
.tx .c{font-size:12px;color:var(--text2)}
.tx .a{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.tx .a.pos{color:var(--success)}
/* detail sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;overflow:hidden;padding-bottom:env(safe-area-inset-bottom);animation:up .2s ease-out}
.sheet .stripe{height:5px}
.sheet .in{padding:16px 18px 22px;display:flex;flex-direction:column;gap:12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:999px}
.close{border:none;background:var(--fill);color:var(--text2);width:30px;height:30px;border-radius:99px;cursor:pointer;font-size:14px;flex-shrink:0}
.kv{display:grid;grid-template-columns:auto 1fr;column-gap:16px;row-gap:6px;font-size:13px}
.kv .k{color:var(--text3)}
.btn{border:1px solid var(--border2);background:transparent;border-radius:999px;padding:8px 15px;font-size:13px;cursor:pointer}
.btn.pri{border:none;color:#fff;font-weight:700}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
/* desktop */
@media (min-width:720px){
  .stats.money .v{font-size:22px}.stats.money .stat{padding:10px 12px}
  .app{padding:0 28px 40px}
  .tabs{padding:14px 28px 12px;margin:0 -28px}
  .h1{font-size:28px}
  .grid2{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
  .grid2.even{grid-template-columns:1fr 1fr}
  .card{padding:18px}
  .week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
  .week .day{display:flex;flex-direction:column;gap:6px;min-width:0}
  .week .day h4{text-align:center;padding:4px 0 8px;border-bottom:1px solid var(--border);margin:0}
  .week .day h4 .wd{display:block;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
  .week .day h4 .dn{display:inline-block;width:30px;height:30px;line-height:30px;border-radius:99px;font-size:15px;margin-top:2px}
  .week .day h4.today .dn{background:var(--text);color:var(--bg)}
  .week .day h4.today{color:var(--text)}
  .month{gap:6px}
  .mc{min-height:98px;align-items:stretch;padding:6px}
  .dots{display:none}
  .mt{display:block;font-size:10.5px;line-height:15px;padding:0 5px;border-radius:4px;border-left:2px solid;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .more{font-size:10.5px;color:var(--text3);padding-left:5px}
  .stat .v{font-size:22px}
  .scrim{align-items:center}
  .sheet{border-radius:20px}
}
@media (max-width:719px){ .wkonly-desk{display:none} .more{display:none} }
@media (min-width:720px){ .wkonly-mob{display:none} }

/* dashboard */
.cover{position:relative;height:150px;margin:0 -16px;background-size:cover;background-position:center}
.coverbtn{position:absolute;right:12px;bottom:12px;background:rgba(255,255,255,.88);color:#1c1c1e;border:none;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.coverpick{position:absolute;right:12px;top:calc(100% - 6px);z-index:8;width:270px;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:12px;display:flex;flex-direction:column;gap:10px}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.preset{height:46px;border-radius:8px;border:2px solid transparent;cursor:pointer;background-size:cover;padding:0}
.preset.on{border-color:var(--text)}
.upl{display:flex;align-items:center;justify-content:center;gap:6px;border:1px dashed var(--border2);border-radius:10px;padding:9px;font-size:13px;cursor:pointer;color:var(--text)}
.upl input{display:none}
.tiny{font-size:11px;color:var(--text3)}
.hello{position:relative;padding-top:0}
.icon{width:62px;height:62px;border-radius:16px;margin-top:-31px;position:relative;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#fff;background:linear-gradient(135deg,#5B6CF0,#A97CD6 60%,#EF6F5E);border:3px solid var(--bg)}
.dash{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.folders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px;padding-top:8px}
.folder{position:relative;border-radius:4px 14px 14px 14px;padding:12px 12px 11px;cursor:pointer;text-align:left;border:1px solid;display:flex;flex-direction:column;gap:2px;min-width:0;background:var(--card)}
.folder .tabt{position:absolute;top:-9px;left:-1px;width:46%;height:10px;border-radius:7px 9px 0 0}
.folder .fl{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700}
.folder .fn{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px;line-height:1.1}
.folder .fs{font-size:12px;color:var(--text2)}
.folder .fx{font-size:11.5px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.goal{display:flex;align-items:center;gap:10px;padding:5px 2px}
.goal .gt{flex:1;min-width:0;font-size:14px;cursor:pointer}
.goal .del{border:none;background:none;color:var(--text3);cursor:pointer;font-size:15px;padding:2px 6px;border-radius:6px}
.goal .del:hover{background:var(--fill);color:var(--text)}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;border:1px solid var(--border);background:var(--subtle);color:var(--text);border-radius:10px;padding:9px 11px;font:inherit;font-size:16px;outline:none}
.addrow input:focus{border-color:var(--border2);background:var(--card)}
.addrow button{border:none;background:var(--text);color:var(--bg);border-radius:10px;padding:0 14px;font-size:13px;font-weight:700;cursor:pointer}
.tsum{display:flex;gap:10px;align-items:center}
.tsum .tm{width:58px;flex-shrink:0;font-size:12px;color:var(--text2);font-variant-numeric:tabular-nums}
.tsum .row{flex:1}
.tsum .title{white-space:normal}
.dash .month .mc{min-height:46px}
.dash .month .mt,.dash .month .more{display:none!important}
.dash .month .dots{display:flex!important}
@media (min-width:720px){
  .cover{margin:14px 0 0;height:210px;border-radius:18px}
  .hello{padding-left:24px}
  .folders{grid-template-columns:repeat(3,minmax(0,1fr))}
  .dash{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
  .dash .full{grid-column:1/-1}
  .dash .month .mc{min-height:52px;align-items:center}
}
@media (min-width:1000px){ .folders{grid-template-columns:repeat(6,minmax(0,1fr))} }

/* v3 layout in original style */
.qa{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.qb{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:var(--card);font-size:13px;cursor:pointer;color:var(--text)}
.qb .pl{color:var(--text2);font-size:15px;line-height:1}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.dcol{display:flex;flex-direction:column;gap:16px;min-width:0}
.clockt{flex-direction:row!important;align-items:center;gap:16px!important}
.clockt .big{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.mfull .month .mt.dn{text-decoration:line-through;color:var(--text3)}
.qmodal .fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text2)}
.qmodal .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld input,.fld select{border:1px solid var(--border);background:var(--subtle);color:var(--text);border-radius:10px;padding:9px 11px;font:inherit;font-size:16px;outline:none;width:100%;min-width:0}
.fld input:focus,.fld select:focus{border-color:var(--border2);background:var(--card)}
@media (min-width:720px){
  .dgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .dgrid .wide{grid-column:1/-1}
}
@media (min-width:1080px){
  .dgrid{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,1fr)}
  .dgrid .wide{grid-column:auto}
}
.dgrid .full{grid-column:1/-1}
.dgrid .row .title{white-space:normal}

/* v4 desktop home: fits one viewport */
body.deskhome .app{padding-bottom:0}
body.deskhome .banner{display:none}
.dh .samp{display:inline-block;margin-left:8px;font-size:11px;color:var(--text3);border:1px solid var(--border);border-radius:999px;padding:0 7px}
.dh{display:flex;flex-direction:column;gap:10px;height:calc(100vh - var(--top,110px) - 14px);min-height:520px;padding-top:12px}
.dh .cover{margin:0;height:clamp(56px,10vh,104px);border-radius:16px;flex-shrink:0}
.dh .cover .coverbtn{bottom:10px;padding:5px 10px}
.dhead{display:flex;align-items:flex-end;gap:14px;padding:0 18px;flex-shrink:0;margin-top:-26px;position:relative}
.dhead{margin-top:0!important;padding:0 2px!important;align-items:center!important}
.dhead .gtxt{padding-top:0}
.dhead .icon{margin-top:0;width:52px;height:52px;font-size:24px;border-radius:14px;flex-shrink:0}
.dhead .gtxt{flex:1;min-width:0;padding-bottom:2px}
.dhead .eyebrow{font-size:12px}
.dhead .h1{font-size:22px;margin-top:0;line-height:1.2}
.dhead .qa{margin:0;flex-wrap:nowrap}
.dgoals{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:6px 10px 6px 14px;flex-shrink:0;min-width:0}
.dgoals .gh{font-size:13px;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:8px}
.dgoals .gh .r{font-weight:500;color:var(--text3);font-size:12px}
.dgoals .gl{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(to right,#000 94%,transparent);mask-image:linear-gradient(to right,#000 94%,transparent);padding-right:24px}
.dgoals .gl::-webkit-scrollbar{display:none}
.gchip{display:flex;align-items:center;gap:7px;flex-shrink:0;border:1px solid var(--border);border-radius:999px;padding:4px 6px 4px 5px;font-size:13px;background:var(--subtle);max-width:260px}
.gchip .check{width:18px;height:18px;border-radius:99px;font-size:11px;line-height:15px}
.gchip .gt{cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gchip .del{border:none;background:none;color:var(--text3);cursor:pointer;font-size:11px;padding:0 4px;opacity:0;transition:opacity .15s}
.gchip:hover .del{opacity:1}
.dgoals .gadd{width:150px;flex-shrink:0;border:1px dashed var(--border2);background:transparent;color:var(--text);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;outline:none}
.dgoals .gadd:focus{border-style:solid;background:var(--card)}
.dfold{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;flex-shrink:0}
.vf{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:5px 5px 7px;cursor:pointer;display:flex;flex-direction:column;gap:5px;min-width:0;transition:border-color .15s,transform .15s}
.vf:hover{transform:translateY(-1px)}
.vf .vt{height:clamp(30px,5vh,52px);border-radius:10px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.vf .vt .tb{position:absolute;left:0;top:0;width:38%;height:4px;border-radius:0 0 4px 0}
.vf .vl{display:flex;align-items:center;gap:6px;padding:0 4px;font-size:13px;font-weight:700;min-width:0}
.vf .vl .n{margin-left:auto;font-weight:600;font-size:12px;color:var(--text2);white-space:nowrap}
.dcal{flex:1;min-height:0;display:grid;grid-template-columns:260px minmax(0,1fr);gap:12px}
.dside{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 12px;display:flex;flex-direction:column;gap:8px;min-height:0}
.dside .sh{display:flex;align-items:baseline;gap:8px;padding:0 4px}
.dside .sh .t{font-size:15px;font-weight:700;flex:1}
.dside .sh .r{font-size:12px;color:var(--text3)}
.dside .sl{display:flex;flex-direction:column;gap:4px;overflow-y:auto;min-height:0;scrollbar-width:thin}
.srow{display:flex;align-items:center;gap:9px;padding:6px 6px 6px 8px;border-radius:8px;border-left:3px solid;cursor:pointer}
.srow .check{width:18px;height:18px;border-radius:6px;font-size:11px;line-height:15px}
.srow .st{flex:1;min-width:0}
.srow .st .a{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .st .b{font-size:11px;color:var(--text2)}
.srow.done .st .a{color:var(--text3);text-decoration:line-through}
.ac{background:var(--card);border:1px solid var(--border);border-radius:16px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ach{display:flex;align-items:center;gap:10px;padding:10px 16px 6px}
.ach .mt1{font-size:22px;font-weight:700;letter-spacing:-.01em;flex:1}
.ach .mt1 span{font-weight:500;color:var(--text2)}
.nav{display:flex;align-items:center;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.nav button{border:none;background:var(--card);padding:4px 10px;font-size:13px;cursor:pointer;color:var(--text)}
.nav button+button{border-left:1px solid var(--border)}
.nav button:hover{background:var(--subtle)}
.awd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:0 0 4px}
.awd div{font-size:11px;color:var(--text3);text-align:right;padding:0 10px;letter-spacing:.02em}
.agrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.acell{border-top:1px solid var(--border);border-left:1px solid var(--border);padding:3px 5px 3px;display:flex;flex-direction:column;min-height:0;min-width:0;cursor:pointer;overflow:hidden}
.acell:nth-child(7n+1){border-left:none}
.acell.out .anum{color:var(--text3)}
.acell.wkend{background:rgba(127,127,127,.03)}
.acell.sel{background:var(--subtle)}
.anum{align-self:flex-end;font-size:12px;font-weight:600;min-width:20px;height:20px;line-height:20px;text-align:center;border-radius:99px;font-variant-numeric:tabular-nums;flex-shrink:0}
.anum.today{background:#E5484D;color:#fff;font-weight:700}
.evs{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;gap:1px;overflow:hidden}
.ev{display:flex;align-items:center;gap:5px;font-size:11px;line-height:15px;height:15px;min-width:0;padding:0 3px;border-radius:4px;flex-shrink:0}
.ev .d{width:6px;height:6px;border-radius:99px;flex-shrink:0}
.ev .x{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .tm{color:var(--text3);font-variant-numeric:tabular-nums;flex-shrink:0}
.ev.dn .x{text-decoration:line-through;color:var(--text3)}
.ev.more{color:var(--text2);font-weight:600;padding-left:4px}

/* v5: goals column */
.dmain{flex:1;min-height:0;display:grid;grid-template-columns:calc((100% - 50px) / 6 + 40px) minmax(0,1fr);gap:10px}
.dleft .dgc .sh .t{white-space:nowrap}
.dmain .dleft{gap:10px}
.dleft,.dright{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
.dright .ac{flex:1}
.dgc{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:10px 10px 8px;display:flex;flex-direction:column;gap:4px;min-height:0;flex:0 1 auto;max-height:42%}
.dgc .sh{display:flex;align-items:baseline;gap:8px;padding:0 4px}
.dgc .sh .t{font-size:15px;font-weight:700;flex:1}
.dgc .sh .r{font-size:12px;color:var(--text3)}
.dgc .gl2{display:flex;flex-direction:column;overflow-y:auto;min-height:0;scrollbar-width:thin}
.dgc .gi{display:flex;align-items:center;gap:9px;padding:3px 4px;border-radius:8px}
.dgc .gi:hover{background:var(--subtle)}
.dgc .gi .check{width:18px;height:18px;border-radius:99px;font-size:11px;line-height:15px}
.dgc .gi .gt{flex:1;min-width:0;font-size:13px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dgc .gi .del{border:none;background:none;color:var(--text3);cursor:pointer;font-size:11px;padding:0 4px;opacity:0;transition:opacity .15s}
.dgc .gi:hover .del{opacity:1}
.dgc .gadd{border:1px dashed var(--border2);background:transparent;color:var(--text);border-radius:10px;padding:6px 10px;font:inherit;font-size:13px;outline:none;width:100%;flex-shrink:0}
.dgc .gadd:focus{border-style:solid;background:var(--card)}
.dleft .dside{flex:1}
.dleft .dgc{max-height:none;flex:0 0 auto;padding:10px 8px 8px}
.dleft .dgc .gl2{overflow:visible}
.dleft .dgc .gi{align-items:flex-start;gap:7px;padding:3px 2px}
.dleft .dgc .gi .check{width:16px;height:16px;line-height:13px;font-size:10px;flex-shrink:0;margin-top:1px}
.dleft .dgc .gi .gt{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.35}
.dleft .dgc .sh,.dleft .dside .sh{padding:0 2px;gap:6px}
.dleft .dgc .sh .r,.dleft .dside .sh .r{flex-shrink:0}
.dleft .dside{padding:12px 8px;flex:1 1 0}
.dleft .srow{align-items:flex-start;gap:7px;padding:6px 6px 6px 7px}
.dleft .srow .check{width:16px;height:16px;line-height:13px;font-size:10px;flex-shrink:0;margin-top:1px}
.dleft .srow .st .a{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.35}
.dleft .srow .st .b{white-space:normal;line-height:1.35;margin-top:1px}
.vf .vl{overflow:hidden;gap:5px}
.vf .vl>span:nth-child(2){min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vf .vl .n{font-size:11.5px}

/* v15: goals card between greeting and folders, left-column width, peach */
.dtop>.dgc{max-height:none;flex:none;width:auto;box-sizing:border-box;padding:12px 14px 10px;gap:6px}
.dtop>.dgc .sh{padding:0 2px;gap:6px;align-items:center}
.dtop>.dgc .sh .t{white-space:nowrap}
.dtop>.dgc .sh .r{flex-shrink:0;margin-left:auto}
.dtop>.dgc .gl2{overflow:visible;display:grid;grid-auto-flow:column;grid-template-rows:repeat(3,auto);grid-auto-columns:minmax(0,1fr);column-gap:14px;align-content:start}
.dtop>.dgc .gi{align-items:flex-start;gap:7px;padding:3px 2px}
.dtop>.dgc .gi:hover{background:var(--subtle)}
.dtop>.dgc .gi .check{width:16px;height:16px;line-height:13px;font-size:10px;flex-shrink:0;margin-top:1px}
.dtop>.dgc .gi .gt{white-space:normal;line-height:1.35}
.dtop>.dgc .gadd{margin-top:2px}

/* v18: fitness card (Quicksand, filled pictograms) */
.dtop{display:grid;grid-template-columns:repeat(2,calc((100% - 50px) / 3 + 10px));gap:10px;align-items:stretch;flex-shrink:0}
.fitc{font-family:'QuicksandFit','Quicksand','Nunito','Varela Round',ui-rounded,system-ui,sans-serif;background:linear-gradient(165deg,#FFF5F3 0%,var(--card) 70%);border:1px solid #F5C9C1;border-radius:16px;padding:12px 14px 10px;display:flex;flex-direction:column;gap:8px;cursor:pointer;min-width:0;transition:transform .15s}
.fitc:hover{transform:translateY(-1px)}
.fpill{align-self:flex-start;font-size:10.5px;font-weight:700;letter-spacing:.02em;color:#fff;background:#EF6F5E;border-radius:999px;padding:3px 10px}
.fbig{display:flex;align-items:center;gap:14px;min-width:0}
.fbadge{width:56px;height:56px;border-radius:99px;background:#EF6F5E;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fnm{min-width:0}
.fn1{font-size:27px;font-weight:600;letter-spacing:-.005em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#2B2321}
.fn1.dn{color:var(--text3);text-decoration:line-through}
.fn2{font-size:12px;font-weight:500;color:var(--text2);margin-top:3px}
.fdiv{height:1px;background:var(--border);margin:0}
.flab{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.02em;color:#8A7F7C}
.frows{display:flex;flex-direction:column;gap:6px;padding-left:5px}
.frow{display:flex;align-items:center;gap:12px;min-width:0;height:24px}
.fbar{width:3.5px;height:20px;border-radius:3px;background:#EF6F5E;flex-shrink:0}
.fday{font-size:13px;font-weight:600;color:#EF6F5E;width:32px;flex-shrink:0}
.fsep{width:1px;height:20px;background:#E3D6D3;flex-shrink:0;margin-left:2px}
.fwn{font-size:14.5px;font-weight:600;color:#2B2321;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* v20: third card */
.dtop{grid-template-columns:repeat(2,calc((100% - 50px) / 3 + 10px)) minmax(0,1fr)!important}
.d3{position:relative;min-height:0;min-width:0}
.d3i{position:absolute;inset:0;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px 14px 10px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tdc,.tlc{display:flex;flex-direction:column;min-height:0;flex:1;gap:6px}
.tdh{display:flex;align-items:center;gap:8px;padding:0 2px}
.tdh .t{font-size:15px;font-weight:700;flex:1;white-space:nowrap}
.tdh .r{font-size:12px;color:var(--text3);font-weight:600}
.tdbar{height:5px;border-radius:99px;background:var(--subtle);overflow:hidden;margin:0 2px 2px;flex-shrink:0}
.tdbar span{display:block;height:100%;border-radius:99px;background:#E3A33B}
.tdl{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:1px}
.trw{display:flex;align-items:center;gap:8px;padding:2px 4px 2px 2px;border-radius:8px;cursor:pointer;min-width:0;flex-shrink:0}
.trw:hover{background:var(--subtle)}
.trw .tbar{width:3px;height:18px;border-radius:3px;flex-shrink:0}
.trw .check{width:17px;height:17px;border-radius:5px;font-size:10px;line-height:14px;flex-shrink:0}
.trw .ttl{flex:1;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trw.done .ttl{color:var(--text3);text-decoration:line-through;font-weight:500}
.trw .ttag{font-size:10.5px;font-weight:600;color:var(--text2);background:var(--subtle);border-radius:99px;padding:1px 7px;white-space:nowrap;flex-shrink:0}
.trw .ttag.hi{background:#FDE7E3;color:#C9503F}
.tdsub{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);padding:5px 4px 1px;flex-shrink:0}
.tdmore{align-self:flex-start;border:none;background:none;padding:0 4px;font:inherit;font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;flex-shrink:0}
.tdmore:hover{color:var(--text)}
.tll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;position:relative}
.tll::-webkit-scrollbar{display:none}
.tlr{display:grid;grid-template-columns:44px 34px minmax(0,1fr) 22px;align-items:center;column-gap:8px;position:relative;min-height:40px}
.tlr .tln{position:relative;align-self:stretch;display:flex;align-items:center;justify-content:center}
.tlr .tln::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1.5px;margin-left:-.75px;background:var(--border2)}
.tlr:first-child .tln::before{top:50%}
.tlr:last-child .tln::before{bottom:50%}
.tlr .dot{position:relative;width:30px;height:30px;border-radius:99px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px var(--card)}
.tlr .pill{position:relative;width:32px;height:58px;border-radius:99px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px var(--card)}
.tlr.cur{min-height:66px}

 I("t4","todo","Book dentist appointment",d2(18),{priority:"Medium"}),
 I("t5","todo","Draft newsletter for winter drop",d2(19),{priority:"High"}),
 I("t6","todo","Update app wishlist",d2(20),{priority:"Low"}),
 I("e0","errand","Car service",d2(12),{tag:"Workshop",done:true}),

[16,17,18,19,20,21,22].forEach(function(n){ITEMS.push(I("rm"+n,"routine","Morning routine",d2(n),{start:6.5,end:7,tag:"Daily",note:"Water and vitamins, stretch, journal, plan the day."}))});

function tint(c,a){return c+a}

  var c=CAT[i.cat],d=!!S.done[i.id];
  var meta=[showDate?fdate(i.date):null,i.start!=null?tr(i):null,i.tag||null].filter(Boolean).join(" · ");
  return '<div class="row'+(d?' done':'')+'" data-a="open" data-id="'+i.id+'" style="border-color:'+c.color+'">'+
   (CHECKABLE.indexOf(i.cat)>=0?check(i.id,c.color):dot(c.color))+
   '<div class="main"><div class="title">'+esc(i.title)+'</div>'+(meta?'<div class="meta">'+esc(meta)+'</div>':'')+'</div>'+
   (i.priority&&!d?'<span class="prio p-'+i.priority+'">'+i.priority+'</span>':'')+
   (i.amount!=null?'<span class="amt">'+rm(i.amount)+'</span>':'')+'</div>';
}

function rdone(){return ROUTINE.filter(function(s){return S.done[s[0]]}).length}
function totals(){var s=0,b=0;SPEND.forEach(function(x){b+=x[1];s+=x[2]});return {s:s,b:b}}
function byDay(d){return ITEMS.filter(function(i){return S.on[i.cat]&&i.date===d}).sort(function(a,b){return (a.start==null?-1:a.start)-(b.start==null?-1:b.start)})}

  var todos=ITEMS.filter(function(i){return i.cat==="todo"&&i.date>=TODAY}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:ord[a.priority]-ord[b.priority]}).slice(0,4);
  var errs=ITEMS.filter(function(i){return i.cat==="errand"&&(i.date===TODAY||i.date===d2(17))});
  var t=totals();var nb=ITEMS.filter(function(i){return i.cat==="budget"&&i.date>=TODAY&&!S.done[i.id]}).sort(function(a,b){return a.date<b.date?-1:1})[0];
  var rd=rdone();
  var chips=CATS.map(function(k){var n=ITEMS.filter(function(i){return i.cat===k.id&&i.date===TODAY}).length+(k.id==="routine"?ROUTINE.length-1:0);if(k.id==="budget")n=ITEMS.filter(function(i){return i.cat==="budget"&&WEEK.indexOf(i.date)>=0}).length;
    return '<button class="chip" data-a="go" data-v="'+k.id+'" style="background:'+tint(k.color,"12")+'">'+dot(k.color)+k.label+'<span class="n">'+n+'</span></button>'}).join("");
  var sched=timed.map(function(i){var c=CAT[i.cat],d=!!S.done[i.id];
    return '<div class="sched"><div class="tm">'+ft(i.start)+'</div><div class="blk" data-a="open" data-id="'+i.id+'" style="border-color:'+c.color+';background:'+tint(c.color,"14")+'"><div class="row-main" style="flex:1;min-width:0"><div class="'+(d?'done title':'')+'" style="font-size:14px;font-weight:500">'+esc(i.title)+'</div><div class="meta" style="font-size:12px;color:var(--text2);margin-top:2px">'+c.label+' · '+tr(i)+'</div></div>'+(CHECKABLE.indexOf(i.cat)>=0?check(i.id,c.color):'')+'</div></div>'}).join("");
  return '<div><div class="eyebrow">Monday, 16 November</div><div class="h1">Good morning, Mariama</div></div>'+

   '<div class="grid2"><div class="col">'+

   '</div><div class="col">'+

     card(ct("Money this month",'<button class="link" data-a="go" data-v="budget">Budget →</button>',CAT.budget.color)+
       '<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text2)"><span><b style="color:var(--text);font-weight:600">'+rm(t.s)+'</b> spent</span><span>of '+rm(t.b)+'</span></div>'+bar(t.s/t.b,CAT.budget.color,8)+
       (nb?'<div style="font-size:13px;color:var(--text2)">Next bill: <span style="color:var(--text)">'+esc(nb.title.replace(" due",""))+'</span>, '+rm(nb.amount)+' on '+fdate(nb.date)+'</div>':''))+

}

  }
  return '<div class="calhead"><div class="h1">'+(S.cal==="week"?"16 – 22 November":"November 2026")+'</div>'+seg("cal",[["week","Week"],["month","Month"]],S.cal)+'</div>'+chips+body;
}
function phead(k,stats,cls){
  return '<div class="phead"><div class="stripe" style="background:'+k.color+'"></div><div><div class="h1">'+k.label+'</div><div class="sub">'+k.blurb+' Everything here also shows on your calendar in '+k.name+'.</div></div></div>'+
   '<div class="stats'+(cls?' '+cls:'')+'">'+stats.map(function(s){return '<div class="stat" style="background:'+tint(k.color,"0D")+'"><div class="v">'+s[1]+'</div><div class="l">'+s[0]+'</div></div>'}).join("")+'</div>';
}
function vList(cat){
  var k=CAT[cat],show=S.show[cat]||"upcoming";
  var all=ITEMS.filter(function(i){return i.cat===cat}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.start==null?-1:a.start)-(b.start==null?-1:b.start)});
  function isD(i){return CHECKABLE.indexOf(cat)>=0?!!S.done[i.id]:i.date<TODAY}
  var list=all.filter(function(i){return show==="all"||(show==="done"?isD(i):!isD(i))});
  var dates=[];list.forEach(function(i){if(dates.indexOf(i.date)<0)dates.push(i.date)});
  var dn_=all.filter(isD).length,tw=all.filter(function(i){return i.date>=TODAY&&i.date<=d2(22)}).length;
  var stats=cat==="todo"?[["Open",all.length-dn_],["High priority",all.filter(function(i){return i.priority==="High"&&!isD(i)}).length],["Done",dn_]]
    :[["This week",tw],["Upcoming",all.length-dn_],[cat==="work"?"Past":"Done",dn_]];
  var h=phead(k,stats);
  if(cat==="workout"){
    var wd=all.filter(function(i){return WEEK.indexOf(i.date)>=0});
    h+=card(ct("This week",'<span class="r">'+wd.filter(function(i){return S.done[i.id]}).length+' of '+wd.length+' done</span>')+
     '<div class="wk">'+WEEK.map(function(d){var w=all.filter(function(i){return i.date===d})[0],fin=!!(w&&S.done[w.id]);
       return '<div'+(w?' data-a="open" data-id="'+w.id+'" style="cursor:pointer"':'')+'><div class="d">'+dow(d)+'</div><div class="c" style="background:'+(fin?k.color:w?tint(k.color,"26"):'var(--fill)')+';'+(d===TODAY?'box-shadow:0 0 0 2px var(--bg),0 0 0 4px '+k.color:'')+'">'+(fin?'✓':'')+'</div><div class="g">'+(w?({Outdoors:'Hike',Mobility:'Yoga'}[w.tag]||w.tag):'Rest')+'</div></div>'}).join("")+'</div>');
  }
  h+=seg("show",[["upcoming","Upcoming"],["done",cat==="work"?"Past":"Done"],["all","All"]],show);
  h+='<div class="list" style="gap:16px">'+(dates.length?dates.map(function(d){return '<div class="list"><div class="dateh'+(d===TODAY?' today':'')+'">'+fdate(d)+'</div>'+list.filter(function(i){return i.date===d}).map(function(i){return row(i,false)}).join("")+'</div>'}).join(""):'<div class="free">All clear.</div>')+'</div>';
  return h;
}
function vRoutine(){
  var k=CAT.routine,rd=rdone(),days=STREAK.concat([rd]);
  return phead(k,[["Done today",rd+"/"+ROUTINE.length],["Day streak","4"],["14-day avg","86%"]])+
   '<div class="grid2 even">'+card(ct("Morning",'<span class="r">6:30 AM</span>',k.color)+steps("Morning"))+card(ct("Evening",'<span class="r">9:30 PM</span>',k.color)+steps("Evening"))+'</div>'+
   card(ct("Last 14 days",'<span class="r">darker = more done</span>')+'<div class="heat">'+days.map(function(n,i){var a=Math.round(30+n/8*225).toString(16).padStart(2,"0");
     return '<div title="'+n+' of 8" style="background:'+(n?tint(k.color,a):'var(--fill)')+(i===13?';outline:2px solid var(--text);outline-offset:1px':'')+'"></div>'}).join("")+'</div><div class="between"><span>3 Nov</span><span>Today</span></div>')+
   '<div class="list"><div class="dateh">Weekly</div>'+row(BYID.rc22,true)+'</div>';
}
function vBudget(){
  var k=CAT.budget,t=totals();
  var bills=ITEMS.filter(function(i){return i.cat==="budget"}).sort(function(a,b){return a.date<b.date?-1:1});
  return phead(k,[["Income",rm(INCOME)],["Spent of "+rm(t.b),rm(t.s)],["Left to spend",rm(t.b-t.s)]],"money")+
   '<div class="grid2">'+card(ct("Spent vs budget",'<span class="r">November</span>')+'<div class="list" style="gap:12px">'+SPEND.map(function(s){var over=s[2]>s[1];
      return '<div class="spend'+(over?' over':'')+'"><div class="top"><span>'+s[0]+'</span><span>'+rm(s[2])+' / '+rm(s[1])+(over?' · over':'')+'</span></div>'+bar(s[2]/s[1],over?'var(--danger)':k.color)+'</div>'}).join("")+'</div>')+
   card(ct("Bills",'<span class="r">tick when paid</span>',k.color)+'<div class="list">'+bills.map(function(i){return row(i,true)}).join("")+'</div>')+'</div>'+
   card(ct("Recent transactions")+'<div>'+TX.map(function(x){return '<div class="tx"><div class="d">'+x[0]+' Nov</div><div class="m"><div>'+x[1]+'</div><div class="c">'+x[2]+'</div></div><div class="a'+(x[3]>0?' pos':'')+'">'+(x[3]>0?'+':'−')+rm(Math.abs(x[3]))+'</div></div>'}).join("")+'</div>');
}

function coverBg(){
  if(COVER.type==="image"&&COVER.src)return 'url("'+COVER.src+'") center/cover';
  if(COVER.type==="temp"&&coverObjURL)return 'url("'+coverObjURL+'") center/cover';

function setCoverFile(file){
  if(!file||!/^image\//.test(file.type))return;
  if(coverObjURL)URL.revokeObjectURL(coverObjURL);
  coverObjURL=URL.createObjectURL(file);COVER={type:"temp"};S.coverNote="";S.coverOpen=false;render();
  var img=new Image();img.onload=function(){
    var max=1600,sc=Math.min(1,max/img.width),c=document.createElement("canvas");
    c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    var data=c.toDataURL("image/jpeg",0.8);
    if(data.length<2400000){var nc={type:"image",src:data};if(LS.set("lm.cover.v1",nc)){COVER=nc;S.coverNote="";render();return}}
    S.coverNote="Photo shown, but too large to save. It resets on reload.";render();
  };img.src=coverObjURL;
}

function tag(k){return '<span class="tag" style="background:'+tint(CAT[k].color,"22")+'">'+CAT[k].label+'</span>'}
function folderInfo(k){
  var all=ITEMS.filter(function(i){return i.cat===k.id});
  var open=all.filter(function(i){return CHECKABLE.indexOf(k.id)>=0?!S.done[i.id]:i.date>=TODAY});
  var today=all.filter(function(i){return i.date===TODAY}).length;
  var next=open.filter(function(i){return i.date>=TODAY}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.start||0)-(b.start||0)})[0];
  if(k.id==="routine"){var rd=rdone();return {n:rd+"/"+ROUTINE.length,s:"habits done today",x:"Next: "+(ROUTINE.filter(function(r){return !S.done[r[0]]})[0]||["","","All done"])[2]}}
  if(k.id==="budget"){var t=totals();return {n:rm(t.b-t.s),s:"left this month",x:next?"Next bill: "+next.title.replace(" due","")+", "+fdate(next.date):"No bills due"}}
  var lbl={work:"upcoming",workout:"to go this month",todo:"open",errand:"to do"}[k.id];
  return {n:String(open.length),s:lbl+(today?" · "+today+" today":""),x:next?"Next: "+next.title:"All clear"};
}

function clockSVG(){var n=new Date(),h=n.getHours()%12,m=n.getMinutes();
  var ticks="";for(var i=0;i<12;i++){var a=i*30*Math.PI/180;ticks+='<line x1="'+(32+Math.sin(a)*25)+'" y1="'+(32-Math.cos(a)*25)+'" x2="'+(32+Math.sin(a)*(i%3?27:28.5))+'" y2="'+(32-Math.cos(a)*(i%3?27:28.5))+'" stroke="var(--text3)" stroke-width="'+(i%3?1:1.6)+'"/>'}
  return '<svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="var(--subtle)" stroke="var(--border2)"/>'+ticks+
   '<line id="hh" x1="32" y1="32" x2="32" y2="18" stroke="var(--text)" stroke-width="2.2" stroke-linecap="round" transform="rotate('+(h*30+m/2)+' 32 32)"/>'+
   '<line id="mm" x1="32" y1="32" x2="32" y2="10" stroke="var(--text2)" stroke-width="1.5" stroke-linecap="round" transform="rotate('+(m*6)+' 32 32)"/><circle cx="32" cy="32" r="2" fill="var(--text)"/></svg>'}

setInterval(function(){var n=new Date(),h=n.getHours()%12,m=n.getMinutes();var a=document.getElementById("hh"),b=document.getElementById("mm"),t=document.getElementById("clk");
  if(a)a.setAttribute("transform","rotate("+(h*30+m/2)+" 32 32)");if(b)b.setAttribute("transform","rotate("+(m*6)+" 32 32)");if(t)t.textContent=clockTxt()},20000);

function qaSave(){
  var t=S.add,name=val("qa1");if(!name){document.getElementById("qaerr").textContent="Give it a name first.";return}
  var id="u"+Date.now(),item=null;

  if(t==="event"){item={id:id,cat:val("qa4")||"work",title:name,date:val("qa2")||TODAY,start:hrs(val("qa5")),end:hrs(val("qa6"))};if(item.start==null)delete item.start;if(item.end==null)delete item.end}
  if(t==="expense"){var a=parseFloat(val("qa7"));if(!(a>0)){document.getElementById("qaerr").textContent="Enter an amount.";return}
    var c=val("qa8");XTX.push({d:dn(TODAY),l:name,c:c,a:a});LS.set("lm.tx.v1",XTX);TX.unshift([dn(TODAY),name,c,-a]);SPEND.forEach(function(sp){if(sp[0]===c)sp[2]+=a})}

function tlCard(){
  var now=nowH(),its=ITEMS.filter(function(i){return i.date===TODAY&&i.start!=null}).sort(function(a,b){return a.start-b.start});
  var cur=-1,nxt=its.length;its.forEach(function(i,ix){var e=i.end!=null?i.end:i.start+.5;if(now>=i.start&&now<e)cur=ix;if(nxt===its.length&&i.start>now)nxt=ix});
  var h='',marked=false;
  function nowRow(){var nx=its[nxt];return '<div class="tlr tlnow" id="tlfocus"><div class="tlt now">'+shortT(now)+'</div><div class="tln"><span class="nd"></span></div><div class="tlx"><div class="m now">Now</div><div class="a">'+(nx?'Free until '+ft(nx.start):'Free for the rest of the day')+'</div></div><div></div></div>'}
  its.forEach(function(i,ix){var c=CAT[i.cat].color,d=!!S.done[i.id],e=i.end!=null?i.end:i.start+.5,past=e<=now,isc=ix===cur;
    if(cur<0&&!marked&&ix===nxt){h+=nowRow();marked=true}
    var dur=Math.round((e-i.start)*60),meta;
    if(isc){var rem=Math.max(1,Math.round((e-now)*60));meta=(rem>=60?Math.floor(rem/60)+'h '+(rem%60?rem%60+'m ':''):rem+'m ')+'remaining'}
    else meta=tr(i)+' ('+(dur>=60?(dur/60)+(dur===60?' hr':' hr'):dur+' min')+')';
    var pct=isc?Math.min(100,Math.max(4,(now-i.start)/(e-i.start)*100)):0;
    var node=isc?'<span class="pill" style="background:linear-gradient(to bottom,'+c+' 0%,'+c+' '+pct+'%,'+tint(c,"22")+' '+pct+'%,'+tint(c,"22")+' 100%)">'+cic(i,'#fff',17)+'</span>'
      :'<span class="dot" style="background:'+tint(c,past?"1A":"26")+'">'+cic(i,c,16)+'</span>';
    var ring='<button class="ring'+(d?' on':'')+'" data-a="toggle" data-id="'+i.id+'" aria-label="'+(d?'Mark not done':'Mark done')+'" style="border-color:'+c+(d?';background:'+c:'')+'">'+(d?'✓':'')+'</button>';
    h+='<div class="tlr'+(isc?' cur':'')+(past&&!isc?' past':'')+'"'+(isc?' id="tlfocus"':'')+'><div class="tlt'+(isc?' now':'')+'">'+(isc?shortT(now):shortT(i.start))+'</div><div class="tln">'+node+'</div><div class="tlx" data-a="open" data-id="'+i.id+'"><div class="m">'+meta+'</div><div class="a">'+esc(i.title)+'</div></div>'+ring+'</div>'});
  if(cur<0&&!marked)h+=nowRow();
  return '<div class="tlc"><div class="tdh"><span class="hpill" style="background:#3A9BD5">WHERE I AM TODAY</span><div class="r">'+its.filter(function(i){return S.done[i.id]}).length+'/'+its.length+'</div></div><div class="tll" id="tll">'+h+'</div></div>';
}

    '<div class="sl">'+(its.length?its.map(function(i){var c=CAT[i.cat],d=!!S.done[i.id];
      return '<div class="srow'+(d?' done':'')+'" data-a="open" data-id="'+i.id+'" style="border-color:'+c.color+';background:'+tint(c.color,"10")+'">'+check(i.id,c.color)+
        '<div class="st"><div class="a">'+esc(i.title)+'</div><div class="b">'+(i.start!=null?tr(i):(i.priority?i.priority+' priority':i.amount!=null?rm(i.amount):'Anytime'))+' · '+c.label+'</div></div></div>'}).join(""):'<div class="free" style="padding:4px">Nothing planned.</div>')+'</div></div>';
  // apple-style month
  var base=new Date(2026,10+S.cm,1),y=base.getFullYear(),m=base.getMonth();
  var off=(base.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),rows=Math.ceil((off+days)/7);
  var cells=[];for(var k=0;k<rows*7;k++){cells.push(new Date(y,m,1-off+k))}
  var grid='<div class="agrid" style="grid-template-rows:repeat('+rows+',minmax(0,1fr))">'+cells.map(function(dt,ix){var d=iso(dt),out=dt.getMonth()!==m,ev=dayItems(d);
      return '<div class="acell'+(out?' out':'')+(ix%7>4?' wkend':'')+(S.hday===d?' sel':'')+'" data-a="hday" data-v="'+d+'"><div class="anum'+(d===TODAY?' today':'')+'">'+dt.getDate()+'</div><div class="evs">'+ev.map(function(i){var c=CAT[i.cat].color,dd=!!S.done[i.id];
        return i.start!=null?'<div class="ev'+(dd?' dn':'')+'"><span class="d" style="background:'+c+'"></span><span class="x">'+esc(i.title)+'</span><span class="tm">'+shortT(i.start)+'</span></div>'
          :'<div class="ev'+(dd?' dn':'')+'" style="background:'+tint(c,"22")+'"><span class="x">'+esc(i.title)+'</span></div>'}).join("")+'</div></div>'}).join("")+'</div>';
  var cal='<div class="ac"><div class="ach"><div class="mt1">'+MONTHS[m]+' <span>'+y+'</span></div><div class="nav"><button data-a="cm" data-v="-1" aria-label="Previous month">‹</button><button data-a="cm" data-v="0">Today</button><button data-a="cm" data-v="1" aria-label="Next month">›</button></div></div>'+
    '<div class="awd">'+["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(function(w){return '<div>'+w+'</div>'}).join("")+'</div>'+grid+'</div>';
  return '<div class="dh">'+cover+head+'<div class="dtop">'+goals+fitCard()+'<div class="d3"><div class="d3i" id="d3">'+(VARIANT==="B"?tlCard():todoCard())+'</div></div></div>'+folders+(VARIANT==="A"?'<div class="dmain solo">':'<div class="dmain"><div class="dleft">'+side+'</div>')+'<div class="dright">'+cal+'</div></div></div>';
}
function fitDesk(){
  var dh=document.querySelector(".dh");if(!dh)return;
  var top=document.getElementById("view").getBoundingClientRect().top+window.scrollY;
  dh.style.setProperty("--top",top+"px");
  document.querySelectorAll(".acell .evs").forEach(function(c){
    var lines=[].slice.call(c.querySelectorAll(".ev:not(.more)"));var old=c.querySelector(".ev.more");if(old)old.remove();
    lines.forEach(function(l){l.style.display=""});
    var H=c.clientHeight,LH=16,cap=Math.max(0,Math.floor((H+1)/LH));
    if(lines.length>cap){var show=Math.max(0,cap-1);lines.forEach(function(l,ix){if(ix>=show)l.style.display="none"});
      if(cap>0){var mo=document.createElement("div");mo.className="ev more";mo.textContent="+"+(lines.length-show)+" more";c.appendChild(mo)}}
  });
}
var _rz;window.addEventListener("resize",function(){clearTimeout(_rz);_rz=setTimeout(function(){
  var want=S.view==="home"&&isDesk(),has=!!document.querySelector(".dh");if(want!==has)render();else if(has)fitDesk()},120)});
function render(){
  var tabs=[["home","Home"],["today","Today"],["calendar","Calendar"]].concat(CATS.map(function(k){return [k.id,k.label,k.color]}));
  document.getElementById("tabs").innerHTML=tabs.map(function(t){var on=S.view===t[0];
    return '<button class="tab'+(on?' on':'')+'" data-a="go" data-v="'+t[0]+'" style="'+(on?'border-color:'+(t[2]||'var(--border2)')+';background:'+(t[2]?tint(t[2],"1A"):'var(--fill)'):'')+'">'+(t[2]?dot(t[2]):'')+t[1]+'</button>'}).join("");
  var tb=document.getElementById("tabs"),ton=tb.querySelector(".tab.on");if(ton){var L=ton.offsetLeft-(tb.clientWidth-ton.offsetWidth)/2;tb.scrollLeft=Math.max(0,L)}
  var v=S.view,dk=v==="home"&&isDesk();document.body.classList.toggle("deskhome",dk);var h=v==="home"?(dk?vHomeDesk():vHome()):v==="today"?vToday():v==="calendar"?vCal():v==="routine"?vRoutine():v==="budget"?vBudget():vList(v);
  document.getElementById("view").innerHTML='<div class="view'+(v==="home"?' home':'')+'">'+h+'</div>';
  sheet();
  qaModal();
  if(dk){fitDesk();d3After()}
}
document.addEventListener("click",function(e){
  if(S.coverOpen&&!e.target.closest(".coverpick")&&!e.target.closest("[data-a=coveropen]")){S.coverOpen=false;render();return}
  var el=e.target.closest("[data-a]");if(!el)return;
  var a=el.getAttribute("data-a"),v=el.getAttribute("data-v"),id=el.getAttribute("data-id");
  if(a==="stop"||a==="stop2")return;
  e.stopPropagation();
  if(a==="toggle"){S.done[id]=!S.done[id];saveDone()}
  else if(a==="coveropen"){S.coverOpen=!S.coverOpen}
  else if(a==="preset"){setPreset(v)}
  else if(a==="hday"){if(VARIANT==="A"&&/^2026-11-/.test(v)){S.view="calendar";S.cal="month";S.day=v;S.sel=null;render();window.scrollTo(0,0);location.hash="calendar-month";return}S.hday=S.hday===v?null:v}
  else if(a==="cm"){S.cm=v==="0"?0:S.cm+parseInt(v,10);if(v==="0")S.hday=null}
  else if(a==="goaltoggle"){GOALS.forEach(function(g){if(g.id===id)g.done=!g.done});saveGoals()}
  else if(a==="goaldel"){GOALS=GOALS.filter(function(g){return g.id!==id});saveGoals()}
  else if(a==="goaladd"){addGoal();return}
  else if(a==="qa"){S.add=v}
  else if(a==="qaclose"){S.add=null}
  else if(a==="qasave"){qaSave();return}
  else if(a==="open"){S.sel=id}
  else if(a==="close"){S.sel=null}
  else if(a==="go"){var ch=S.view!==v;S.view=v;S.sel=null;render();if(ch)window.scrollTo(0,0);location.hash=v;return}
  else if(a==="cal"){S.cal=v}
  else if(a==="filter"){S.on[v]=!S.on[v]}
  else if(a==="all"){CATS.forEach(function(k){S.on[k.id]=true})}
  else if(a==="day"){S.day=v}
  else if(a==="show"){S.show[S.view]=v}
  render();
});
function addGoal(){var inp=document.getElementById("goalinput");var t=inp&&inp.value.trim();if(!t){if(inp)inp.focus();return}
  GOALS.push({id:"g"+Date.now(),text:t,done:false});saveGoals();render();var n=document.getElementById("goalinput");if(n)n.focus()}
document.addEventListener("change",function(e){if(e.target&&e.target.id==="coverfile"){setCoverFile(e.target.files[0])}});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target&&e.target.id==="goalinput"&&!e.isComposing){e.preventDefault();addGoal();return}
  if(e.key==="Enter"&&S.add&&e.target&&/^qa\d$/.test(e.target.id)&&e.target.tagName==="INPUT"&&!e.isComposing){e.preventDefault();qaSave();return}
  if(e.key==="Escape"&&S.add){S.add=null;render();return}if(e.key==="Escape"&&S.sel){S.sel=null;render()}});
// deep links for screenshots/sharing: #today, #calendar, #calendar-month, #workout ...
var hsh=location.hash.slice(1);
if(hsh==="calendar-month"){S.view="calendar";S.cal="month"}else if(hsh==="calendar"||hsh==="today"||hsh==="home"||CAT[hsh]){S.view=hsh}
render();
})();
</script>
